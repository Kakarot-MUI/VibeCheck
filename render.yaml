services:
  - type: web
    name: vibecheck
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: vibecheck-db
          property: connectionString

databases:
  - name: vibecheck-db
    plan: free
